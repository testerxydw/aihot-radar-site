  :root{

  html{-webkit-text-size-adjust:100%}

  .wrap{max-width:1080px; margin:0 auto; padding:28px 20px 64px}
  a{color:inherit}

  .masthead{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);flex:none}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-ink)}
  .backlink{margin-left:auto;font-size:12.5px;font-weight:650;color:var(--ink-3);text-decoration:none;
            border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--panel)}
  .backlink:hover{color:var(--brand-ink);border-color:var(--brand-line);background:var(--brand-soft)}

  .sub{margin:8px 0 0; color:var(--ink-2); font-size:14px; max-width:78ch}
  .sub code{background:#eceff3;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12.5px}

  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:22px 0 10px}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
       padding:14px 16px; box-shadow:var(--shadow); min-width:0}
  .kpi .k{font-size:11.5px; font-weight:700; letter-spacing:.06em; color:var(--ink-3); text-transform:uppercase}
  .kpi .v{margin-top:6px; font-size:23px; font-weight:750; letter-spacing:-.02em; line-height:1.15}
  .kpi .v small{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:0}
  .kpi .n{margin-top:4px; font-size:12.5px; color:var(--ink-3)}
  .kwrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .kw{display:inline-block;background:var(--brand-soft);border:1px solid var(--brand-line);color:var(--brand-ink);
      border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:650}
  .dist{margin-top:9px; display:flex; flex-direction:column; gap:7px}
  .dist .lab{display:flex;justify-content:space-between;gap:10px;margin-bottom:3px;font-size:12.5px;color:var(--ink-2)}
  .dist .bar{height:6px;border-radius:99px;background:#eef1f4;overflow:hidden}
  .dist .bar i{display:block;height:100%;background:var(--brand);border-radius:99px}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
           margin:20px 0 14px; padding:11px 14px; background:var(--panel); border:1px solid var(--line);
           border-radius:var(--radius); box-shadow:var(--shadow); font-size:13px}
  .toolbar .hint{color:var(--ink-3)}
  .toolbar .hint b{color:var(--ink-2)}
  .btn{border:1px solid var(--line-strong);background:#fff;color:var(--ink-2);border-radius:999px;
       padding:5px 13px;font-size:12.5px;font-weight:650;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-soft)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line-strong);background:#fff;color:var(--ink-2);border-radius:999px;
       padding:4px 11px;font-size:12.5px;font-weight:650;cursor:pointer;font-family:inherit}
  .tab[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink)}

  .sec{margin-top:30px}
  .sec-head{display:flex;align-items:baseline;gap:11px;padding:0 2px 9px;border-bottom:2px solid var(--line-strong);flex-wrap:wrap}
  .sec-idx{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:700;color:#fff;

  .sec-head .cnt{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-weight:650;
                 background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
  .empty{margin-top:14px;padding:22px;border:1px dashed var(--line-strong);border-radius:var(--radius);
         background:var(--panel-2);color:var(--ink-3);font-size:13.5px;text-align:center}

               font-size:12.5px;line-height:1.7;text-align:left}

  .item{display:grid;grid-template-columns:46px 1fr;gap:14px;padding:15px 16px;margin-top:10px;
        background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
        transition:border-color .15s ease, transform .15s ease}

       line-height:1.5;letter-spacing:.02em;padding-top:1px}

  .time{font-variant-numeric:tabular-nums}

/* ---------- 关键词高亮 ---------- */
const KEYWORDS = DATA.meta.highlight;
const KW_RE = new RegExp("(" + KEYWORDS.map(k => k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|") + ")","gi");
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const hl = s => esc(s).replace(KW_RE, "<mark>$1</mark>");

/* ---------- 时间口径 ---------- */
function timelineTs(it){
  const d = Date.parse(it.discoveredAt);
  if (!it.publishedAt) return d;
  const p = Date.parse(it.publishedAt);
  if (isNaN(p)) return d;
  return (d - p > 72*3600*1000) ? p : d;
}
function pubTs(it){
  const p = Date.parse(it.publishedAt);
  return isNaN(p) ? Date.parse(it.discoveredAt) : p;
}
const TS_FN = { timeline: timelineTs, published: pubTs };

const CST_DATE = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"});
const CST_HM   = new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Shanghai",hour:"2-digit",minute:"2-digit",hour12:false});
const CST_MD   = new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",month:"numeric",day:"numeric"});
const cstDate  = t => CST_DATE.format(new Date(t));
const cstHM    = t => CST_HM.format(new Date(t));

function relTime(t){
  const now = Date.now(), diff = now - t;
  if (diff < 60000) return "刚刚";
  const min = Math.floor(diff/60000);
  if (min < 60) return min + " 分钟前";
  const h = Math.floor(min/60);
  const dayDelta = Math.round((Date.parse(cstDate(now)+"T00:00:00Z") - Date.parse(cstDate(t)+"T00:00:00Z"))/86400000);
  if (dayDelta === 0) return h + " 小时前";
  if (dayDelta === 1) return "昨天 " + cstHM(t);
  if (dayDelta < 7) return dayDelta + " 天前";
  return CST_MD.format(new Date(t));
}

/* ---------- 状态 ---------- */
const state = { mode: "timeline", only: null };

/* ---------- KPI ---------- */
function renderKpis(){
  const m = DATA.meta;
  const total = DATA.sections.reduce((a,s)=>a+s.items.length,0);
  const max = Math.max(1, ...DATA.sections.map(s=>s.items.length));
  const dist = DATA.sections.map(s => `
    <div>
      <div class="lab"><span>${esc(s.label)}</span><span>${s.items.length}</span></div>
      <div class="bar"><i style="width:${(s.items.length/max*100).toFixed(1)}%"></i></div>
    </div>`).join("");

  document.getElementById("h1").textContent = m.company + " · 最近 " + m.windowDays + " 天动态追踪";
  document.getElementById("sub").innerHTML =
    "对 " + m.keywords.map(k=>`<code>${esc(k)}</code>`).join(" / ") + " 做全文检索，覆盖模型、产品、行业、论文与观点五类动态，"
    + "按固定版块分组并全局连续编号。相关性分层口径：<code>" + esc(m.tiers) + "</code>"
    + (m.dedupe ? "，已开启同题聚合。" : "，未开启同题聚合。");

  document.getElementById("kpis").innerHTML = `
    <div class="kpi">
      <div class="k">时间窗</div>
      <div class="v">最近 ${m.windowDays} 天</div>
      <div class="n">${esc(m.winStart)} ~ ${esc(m.winEnd)} · 北京时间</div>
    </div>
    <div class="kpi">
      <div class="k">命中总数</div>
      <div class="v">${m.rawHits}<small> 条</small></div>
      <div class="n">去重命中（每查询取前 ${m.perQueryLimit} 条）· 精选池 ${m.selectedHits} 条 · 入选 ${m.shown} 条</div>
    </div>
    <div class="kpi">
      <div class="k">检索关键词</div>
      <div class="v" style="font-size:16px;margin-top:7px">全文搜索 q</div>
      <div class="kwrow">${m.keywords.map(k=>`<span class="kw">${esc(k)}</span>`).join("")}</div>
    </div>
    <div class="kpi">
      <div class="k">分类分布</div>
      <div class="dist">${dist}</div>
    </div>`;

  document.getElementById("tb").innerHTML =
    `时间窗 <b>最近 ${m.windowDays} 天</b> · 入选 <b>${total}</b> 条` +
    (m.dedupedFrom ? ` · 同题聚合自 <b>${m.dedupedFrom}</b> 条` : "") +
    ` · 生成于 <b>${esc(m.generated)}</b>`;

  const tabs = document.getElementById("tabs");
  tabs.innerHTML = `<button class="tab" data-cat="" aria-pressed="true">全部</button>` +
    DATA.sections.filter(s=>s.items.length).map(s =>
      `<button class="tab" data-cat="${esc(s.slug)}" aria-pressed="false">${esc(s.label)} ${s.items.length}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    state.only = b.dataset.cat || null;
    tabs.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    renderStream();
  }));
}

/* ---------- 动态流 ---------- */
function renderStream(){
  const tsOf = TS_FN[state.mode];
  const html = DATA.sections.map((s, si) => {
    if (state.only && state.only !== s.slug) return "";
    const idx = String(si+1).padStart(2,"0");
    if (!s.items.length){
      return `<section class="sec">
        <div class="sec-head"><span class="sec-idx">${idx}</span><h2>${esc(s.label)}</h2>
          <span class="cnt">0 条</span></div>
        <div class="empty">本时间窗内，关键词全文检索没有命中该分类的条目。
          ${s.note ? `<span class="note">${esc(s.note)}</span>` : ""}</div>
      </section>`;
    }
    const sorted = s.items.slice().sort((a,b)=> tsOf(b) - tsOf(a));
    const items = sorted.map(it => {
      const t = tsOf(it);
      const badge = it.selected
        ? '<span class="badge sel">精选</span>'
        : '<span class="badge all">全量池</span>';
      const score = (it.score == null ? "" : `<span class="sep">·</span><span>评分 ${it.score}</span>`);
      const also = (it.also && it.also.length)
        ? `<div class="also"><b>同题其他来源（${it.also.length}）：</b>` +
          it.also.map(a => `<a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" title="${esc(a.title)}">${esc(a.source)}</a>`).join(" · ") +
          `</div>` : "";
      return `<li class="item${it.selected ? " is-sel" : ""}">
        <div class="num">${String(it.n).padStart(2,"0")}</div>
        <article class="body">
          <h3 class="t"><a href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">${hl(it.title)}</a></h3>
          <div class="meta">
            ${badge}
            <span class="src">${esc(it.source)}</span>
            <span class="sep">·</span>
            <span class="time" title="北京时间">${relTime(t)}</span>
            ${score}
          </div>
          <p class="sum">${hl(it.summary)}</p>
          ${also}
          <a class="lnk" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">原文链接 ↗
            <span style="font-weight:500;opacity:.75">（第三方原文）</span></a>
        </article>
      </li>`;
    }).join("");
    return `<section class="sec">
      <div class="sec-head"><span class="sec-idx">${idx}</span><h2>${esc(s.label)}</h2>
        <span class="cnt">${s.items.length} 条</span></div>
      <ul class="list">${items}</ul>
    </section>`;
  }).join("");

  document.getElementById("stream").innerHTML = html ||
    `<div class="empty" style="margin-top:30px">该版块在当前筛选下没有条目。</div>`;
}

function renderFoot(){
  const m = DATA.meta;
  const trail = (m.trail || []).map(t =>
    `<tr><td>${esc(t.q)}</td><td>${esc(t.mode)}</td><td>${t.count}</td><td>${t.hasMore ? "是" : "否"}</td><td>${t.from_cache ? "缓存" : "网络"}</td></tr>`).join("");
  document.getElementById("foot").innerHTML = `
    <p><b>数据来源</b>：AI HOT v1 只读 API（<code>${esc(m.api)}</code>）。接口原生时间窗为 <code>24h</code> / <code>7d</code>，
    排序口径为 <code>by=${esc(m.by)}</code>；慢推信源（官方博客、公众号、HuggingFace Daily）按收录时间计入。</p>
    <p><b>筛选口径</b>：关键词 ${esc(m.keywords.join(" / "))} × 池 ${esc(m.modes)} 共 ${(m.trail||[]).length} 次检索，去重命中 ${m.rawHits} 条，
    取相关性分层 <span class="kw">${esc(m.tiers)}</span> 得入选 ${m.shown} 条${m.dedupedFrom ? `（同题聚合前 ${m.dedupedFrom} 条）` : ""}。
    标记 <span class="badge sel">精选</span> 为 AI HOT 精选条目，<span class="badge all">全量池</span> 为未进入精选的公开动态。</p>
    <p><b>免责</b>：${esc(m.copyright)}。摘要由 AI HOT 提供，引用数字与政策表述请回第三方原文核对。</p>
    <details>
      <summary>检索日志（${(m.trail||[]).length} 次请求）</summary>
      <table class="trail"><thead><tr><th>关键词 q</th><th>池 mode</th><th>命中</th><th>还有更多</th><th>来源</th></tr></thead>
      <tbody>${trail}</tbody></table>
    </details>`;
}

document.getElementById("btn-window").addEventListener("click", () => {
  state.mode = (state.mode === "timeline") ? "published" : "timeline";
  document.getElementById("btn-window").textContent =
    "口径：" + (state.mode === "timeline" ? "时间轴（AI HOT）" : "原文发布时间");
  renderStream();
});

renderKpis();
renderStream();
renderFoot();
</script>
</body>
</html>
